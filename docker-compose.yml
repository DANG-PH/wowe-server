# Hạ tầng cho WoWe server: MySQL, Redis.
# Quản lý DB dùng phpMyAdmin riêng trên VPS (kết nối tới container mysql qua host:3457
# hoặc gắn phpMyAdmin vào network "wowe_wowe-net" với server "mysql").
# Mặc định `docker compose up -d` chỉ chạy hạ tầng (app chạy bằng `npm run start:dev` trên host).
# Chạy cả server trong container: `docker compose --profile app up -d --build`.
name: wowe

services:
  mysql:
    image: mysql:8.0
    container_name: wowe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-wowe}
      MYSQL_USER: ${DB_USERNAME:-wowe}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wowe_password}
    ports:
      - "${DB_PORT:-3457}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [wowe-net]

  redis:
    image: redis:7-alpine
    container_name: wowe-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-3456}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [wowe-net]

  # App NestJS — chỉ chạy khi bật profile "app".
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wowe-server
    restart: unless-stopped
    profiles: ["app"]
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [wowe-net]

volumes:
  mysql_data:
  redis_data:

networks:
  wowe-net:
    driver: bridge
